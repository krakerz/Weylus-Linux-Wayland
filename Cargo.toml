[package]
name = "weylus"
version = "0.13.0"
authors = ["HMH <henry@freedesk.net>"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.92"
description = "Use your iPad or Android tablet as graphic tablet."

[dependencies]
anyhow = "1"
base64 = "0.22"
bitflags = { version = "^2.6", features = ["serde"] }
bytes = "1.7.1"
clap = { version = "4.5.18", features = ["derive"] }
clap_complete = "4.5.29"
dbus = "^0.9"
dirs = "7"
fastwebsockets = { version = "0.10", features = ["upgrade", "unstable-split"] }
gstreamer = "0.25"
gstreamer-app = { version = "0.25", features = ["v1_16"] }
gstreamer-video = "0.25"
handlebars = "^6.1"
http-body-util = "0.1.2"
hyper = { version = "^1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.8", features = ["tokio"] }
ipnet = "2"
libc = "0.2"
percent-encoding = "2.1.0"
pnet_datalink = "^0.35"
qrcode = { version = "0.15", default-features = false, features = ["std", "svg"] }
rand = "0.10"
ring = "0.17"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha2 = "0.10"
signal-hook = "0.4"
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "custom-protocol", "dbus", "tray-icon", "image-png"] }
tokio = { version = "^1", features = ["fs", "macros", "rt-multi-thread", "sync", "net"] }
toml = "1"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["ansi", "json"], default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
url = "^2.5"

[build-dependencies]
cc = "^1.1"
pkg-config = "^0.3"
tauri-build = { version = "2.7", features = [] }

[features]
bench = []

[package.metadata.deb]
name = "Weylus"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/weylus", "usr/bin/weylus", "755"],
    ["weylus.desktop", "usr/share/applications/weylus.desktop", "755"],
    ["Readme.md", "usr/share/doc/weylus/README", "644"],
]

[profile.release]
lto = true
opt-level = 3
