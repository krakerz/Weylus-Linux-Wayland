name: PR check
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore: [Readme.md, CHANGELOG.md, LICENSE, CONTRIBUTORS, In_action.gif, .gitignore]
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest   # same as the release workflow's Linux job (cache key)
    container: archlinux:latest
    steps:
      # same packages as the release build's build-linux job
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          base-devel git rust ffmpeg libva dbus gstreamer gst-plugins-base-libs
          wayland wayland-protocols libxkbcommon webkit2gtk-4.1 nodejs npm
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-check
          save-if: false
      - name: Install web dependencies
        run: npm ci
      - run: cargo fmt -- --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: cargo test --release --locked -- --nocapture

  # Oldest supported distro with the MSRV toolchain, same as the release build's floor job.
  floor-ubuntu-2404:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04 # pinned 2026-11; move when GitHub retires the image
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test against Ubuntu 24.04 packages with the MSRV toolchain
        run: bash ci/floor-ubuntu-24.04.sh
