name: Build

on:
  push:
    branches: [ '*' ]
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Newest libraries; the floor job below covers the oldest supported distro.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          base-devel git rust ffmpeg libva libx11 libxext libxfixes
          dbus gstreamer gst-plugins-base-libs cmake wayland wayland-protocols
          libxkbcommon pango cairo glu mesa libxinerama libxcursor libxft nodejs npm
      - uses: actions/checkout@v4
      - name: Install web dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test -- --nocapture
      - name: Build
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: weylus-linux
          path: target/release/weylus

  floor-ubuntu-2404:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test against Ubuntu 24.04 packages with the MSRV toolchain
        run: bash ci/floor-ubuntu-24.04.sh
