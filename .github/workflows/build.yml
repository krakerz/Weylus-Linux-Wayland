name: Build

on:
  push:
    branches: [ master ]
    paths-ignore: [ Readme.md, CHANGELOG.md, LICENSE, CONTRIBUTORS, In_action.gif, .gitignore ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Newest libraries; the floor job below covers the oldest supported distro.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          base-devel git rust ffmpeg libva dbus gstreamer gst-plugins-base-libs
          wayland wayland-protocols libxkbcommon webkit2gtk-4.1 nodejs npm
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-check
      - name: Install web dependencies
        run: npm ci
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked -- --nocapture

  floor-ubuntu-2404:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and test against Ubuntu 24.04 packages with the MSRV toolchain
        run: bash ci/floor-ubuntu-24.04.sh

  package:
    runs-on: ubuntu-latest
    # Oldest supported distro: the assets need glibc 2.39 or newer.
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          bash ci/package-linux.sh deps
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-about
        # Same version as CARGO_ABOUT_VERSION in ci/package-linux.sh; rust-cache keeps ~/.cargo/bin.
        run: cargo about --version 2>/dev/null | grep -q " 0.9.3$" || cargo install --locked --features cli cargo-about@0.9.3
      - name: Cache static FFmpeg
        uses: actions/cache@v6
        with:
          path: /opt/weylus-ffmpeg
          key: ffmpeg-ubuntu2404-${{ hashFiles('ci/build-ffmpeg.sh') }}
      - name: Build tar.gz and AppImage
        run: bash ci/package-linux.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: weylus-linux
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/master'
    needs: [ build-linux, floor-ubuntu-2404, package ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve version
        id: version
        # number: CHANGELOG headers ("## [0.12.0]"); version: tag and title ("v0.12.0").
        run: |
          v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "number=$v" >> "$GITHUB_OUTPUT"
          echo "version=v$v" >> "$GITHUB_OUTPUT"
      - name: Check the version isn't released yet
        id: gate
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::notice::already released; bump the version to publish a new one"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract changelog section
        run: |
          scripts/release-notes.sh "${{ steps.version.outputs.number }}" > release-notes.md
          test -s release-notes.md || { echo "no changelog section"; exit 1; }
          {
            echo ""
            echo "---"
            echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/blob/master/CHANGELOG.md)"
          } >> release-notes.md
      - uses: actions/download-artifact@v8
        with:
          name: weylus-linux
          path: dist
      # The in-app updater refuses unsigned assets, so an unsigned draft must never exist.
      - name: Sign release assets
        if: steps.gate.outputs.released == 'false'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          key="$RUNNER_TEMP/release-signing.pem"
          ( umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key" )
          # The raw public key must match the one embedded in the app (src/update.rs).
          test "$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)" = "KkXTzMlmy7DzEfWOW7VYVXA2J3ewMOaRxGlSgq8KjMY=" \
            || { echo "RELEASE_SIGNING_KEY does not match the public key embedded in the app"; rm -f "$key"; exit 1; }
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-signing.pub"
          for asset in dist/*.tar.gz dist/*.AppImage; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$asset" -out "$asset.sig"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-signing.pub" -rawin -in "$asset" -sigfile "$asset.sig"
          done
          rm -f "$key"
      - name: Draft release
        if: steps.gate.outputs.released == 'false'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sig
