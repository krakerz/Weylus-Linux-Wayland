<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Weylus</title>
    <link rel="stylesheet" href="style.css">
    <script src="lib.js"></script>
    <script>
        run("{{log_level}}");
    </script>
</head>

<body>
    <main id="main">
        <canvas id="video"></canvas>
        <canvas id="canvas" class="vanish"></canvas>
        <div id="debug_overlay" class="hide"></div>
        <div id="stats_overlay" class="hide" aria-live="off">
            <div class="stats_row"><span class="stats_label">Frames (recv / shown)</span><output id="stats_fps">—</output></div>
            <div class="stats_row"><span class="stats_label">Decode</span><output id="stats_decode">—</output></div>
            <div class="stats_row"><span class="stats_label">Latency (capture→screen, approx.)</span><output id="stats_latency">—</output></div>
            <div class="stats_row"><span class="stats_label">RTT</span><output id="stats_rtt">—</output></div>
            <div class="stats_row"><span class="stats_label">Dropped</span><output id="stats_dropped">—</output></div>
            <div class="stats_row"><span class="stats_label">Bitrate</span><output id="stats_bitrate">—</output></div>
            <div class="stats_row"><span class="stats_label">Codec</span><output id="stats_codec">—</output></div>
            <div class="stats_row"><span class="stats_label">Resolution</span><output id="stats_resolution">—</output></div>
        </div>
    </main>
    <div id="settings">
        <div id="handle">⠿</div>
        <div id="settings_scroll">
            <h2>Settings</h2>
            <section>
                <label for="window">Capture:</label>
                <select id="window"></select>
                <button id="refresh">Refresh List</button>
            </section>
            <h3>Video</h3>
            <section>
                <label><input type="checkbox" id="enable_video" checked /> <span>Enable Video</span></label>
                <label><input type="checkbox" id="energysaving" /> <span>Energy Saving (no video, black
                        screen)</span></label>
                <label><input type="checkbox" id="stretch" checked /> <span>Stretch Video</span></label>
                <button id="fullscreen">Toggle Fullscreen</button>
                <label {{#if (not capture_cursor_enabled)}}class="hide" {{/if}}>
                    <input type="checkbox" id="capture_cursor" />
                    <span>Capture Cursor</span>
                </label>
                <label>Max Video Resolution: <br><input type="range" id="scale_video" min="0.1" max="2" step="0.01"
                        value="1.8" /><output></output></label>
                <label>Frame Rate: <br><input type="range" id="frame_rate" value="0" /><output>30</output> fps</label>
                <label>Bitrate: <br><input type="range" id="bitrate" min="0" max="50" step="0.5" value="0" /><output>Auto</output></label>
                <label>Codec: <br><select id="codec">
                        <option value="auto">Auto</option>
                        <option value="h264">H.264</option>
                        <option value="hevc">H.265</option>
                        <option value="av1">AV1</option>
                    </select> <output id="active_codec"></output></label>
            </section>
            <h3>Input</h3>
            <section>
                <label><input type="checkbox" id="enable_mouse" checked /> <span>Enable Mouse</span></label>
                <label><input type="checkbox" id="enable_stylus" checked /> <span>Enable Stylus</span></label>
                <label><input type="checkbox" id="enable_touch" checked /> <span>Enable Touch</span></label>
                <label {{#if (not uinput_enabled)}}class="hide" {{/if}}>
                    <input type="checkbox" id="uinput_support" checked />
                    <span>Enable uinput</span>
                </label>
                <label>Pen pressure: <br><select id="pen_pressure_mode">
                        <option value="device">From device (at least)</option>
                        <option value="fixed">Fixed</option>
                    </select></label>
                <label>Pressure value: <br><input type="range" id="min_pressure" min="0" max="1" step="0.01"
                        value="0" /><output>0.00</output></label>
                <button id="custom_input_areas" {{#if (not enable_custom_input_areas)}}class="hide" {{/if}}>Custom Input
                    Area</button>
                <label {{#if (not enable_custom_input_areas)}}class="hide" {{/if}}><input type="checkbox"
                        id="enable_custom_input_areas" /> <span>Enable Custom Input
                        Area</span></label>
            </section>
            <section {{#if (not uinput_enabled)}}class="hide" {{/if}}>
                <label><span>Client Name:</span><br><input type="text" id="client_name" /><br><span>Optional, useful to
                        distinguish multiple devices.</span></label>
            </section>
            <h3>Shortcuts</h3>
            <section id="shortcuts_section">
                <label><input type="checkbox" id="enable_shortcuts" /> <span>Shortcut Bar</span></label>
                <label>Preset:<br><select id="shortcut_preset">
                        <option value="krita">Krita</option>
                        <option value="gimp">GIMP</option>
                        <option value="xournalpp">Xournal++</option>
                        <option value="generic" selected>Generic</option>
                        <option value="none">None (custom only)</option>
                    </select></label>
                <label>Side:<br><select id="shortcut_side">
                        <option value="left" selected>Left</option>
                        <option value="right">Right</option>
                    </select></label>
                <label>Custom:<br><textarea id="shortcut_custom" rows="4" spellcheck="false" autocapitalize="off"
                        autocomplete="off" placeholder="Save = Ctrl+S&#10;Pan = hold Space"></textarea></label>
                <output id="shortcut_custom_status"></output>
                <small class="shortcut_hint">One per line: Label = Ctrl+Shift+Z, add hold for press-and-hold.</small>
            </section>
            <section id="displayoptions">
                <label id="leftylabel"><input type="checkbox" id="lefty" />Swap</label>
                <label id="vanish">Hide until Reload</label>
            </section>
            <section id="stats_section">
                <label><span>FPS (receiving): </span><output id="fps">0</output></label>
                <label><input type="checkbox" id="enable_stats_overlay" /> <span>Stats Overlay</span></label>
            </section>
            <section id="debug_section">
                <label><input type="checkbox" id="enable_debug_overlay" /> <span>Debug
                        Overlay</span></label>
            </section>
            <section id="log_section" class="hide">
                <label>Log
                    <pre class="log" id="log" />
                </label>
            </section>
            <section id="source_section">
                <a href="https://github.com/krakerz/Weylus-Linux-Wayland" target="_blank" rel="noopener">Source code</a>
            </section>
        </div>
    </div>
    <!-- Icons from Lucide (https://lucide.dev), ISC license: www/static/LUCIDE-LICENSE -->
    <div id="zoom_controls" role="group" aria-label="Zoom controls">
        <button type="button" id="zoom_grip" title="Show zoom controls" aria-label="Show zoom controls">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </svg>
        </button>
        <button type="button" id="zoom_out" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" x2="16.65" y1="21" y2="16.65" />
                <line x1="8" x2="14" y1="11" y2="11" />
            </svg>
        </button>
        <output id="zoom_level" aria-label="Zoom level">100%</output>
        <button type="button" id="zoom_in" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" x2="16.65" y1="21" y2="16.65" />
                <line x1="11" x2="11" y1="8" y2="14" />
                <line x1="8" x2="14" y1="11" y2="11" />
            </svg>
        </button>
        <button type="button" id="zoom_reset" title="Reset zoom" aria-label="Reset zoom">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
            </svg>
        </button>
    </div>
    <div id="shortcut_bar" class="hide" role="toolbar" aria-label="Shortcuts">
        <button type="button" id="shortcut_grip" title="Show shortcuts" aria-label="Show shortcuts">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 8h.01" />
                <path d="M12 12h.01" />
                <path d="M14 8h.01" />
                <path d="M16 12h.01" />
                <path d="M18 8h.01" />
                <path d="M6 8h.01" />
                <path d="M7 16h10" />
                <path d="M8 12h.01" />
                <rect width="20" height="16" x="2" y="4" rx="2" />
            </svg>
        </button>
        <div id="shortcut_buttons"></div>
    </div>
    <template id="shortcut_icons">
        <svg data-icon="undo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
        </svg>
        <svg data-icon="redo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
        </svg>
        <svg data-icon="eraser" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" />
            <path d="m5.082 11.09 8.828 8.828" />
        </svg>
        <svg data-icon="smaller" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M8 12h8" />
        </svg>
        <svg data-icon="bigger" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M8 12h8" />
            <path d="M12 8v8" />
        </svg>
        <svg data-icon="pan" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
            <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
            <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
        </svg>
        <svg data-icon="picker" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12" />
            <path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z" />
            <path d="m2 22 .414-.414" />
        </svg>
        <svg data-icon="pencil" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
            <path d="m15 5 4 4" />
        </svg>
        <svg data-icon="highlighter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 11-6 6v3h9l3-3" />
            <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
        </svg>
    </template>
</body>

</html>
